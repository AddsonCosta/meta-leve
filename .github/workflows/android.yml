name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_BASE64: ${{ secrets.EVOLUI_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes dos cálculos
        run: set -o pipefail; ./gradlew :core:test --stacktrace 2>&1 | tee -a build.log

      - name: APK de debug
        run: set -o pipefail; ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee -a build.log

      - name: Chave de upload (se configurada)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "EVOLUI_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: App bundle de release
        env:
          EVOLUI_KEYSTORE_PASSWORD: ${{ secrets.EVOLUI_KEYSTORE_PASSWORD }}
          EVOLUI_KEY_ALIAS: ${{ secrets.EVOLUI_KEY_ALIAS }}
          EVOLUI_KEY_PASSWORD: ${{ secrets.EVOLUI_KEY_PASSWORD }}
        run: set -o pipefail; ./gradlew :app:bundleRelease --stacktrace 2>&1 | tee -a build.log

      - uses: actions/upload-artifact@v4
        with:
          name: evolui-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: evolui-release-aab
          path: app/build/outputs/bundle/release/*.aab

      # Esquema do banco gerado pelo Room, para conferir as migrações.
      - name: Mostrar esquema do banco
        if: always()
        run: find app/schemas -name '3.json' -print -exec cat {} \; || true

      - uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas

      # Resumo dos erros no fim do log, para achar rápido o que quebrou.
      - name: Resumo dos erros
        if: failure()
        run: grep -E "^e: |What went wrong|error:|FAILED|Execution failed" -A3 build.log | head -200 || true
