name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_BASE64: ${{ secrets.METALEVE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes dos cálculos
        run: ./gradlew :core:test --stacktrace

      - name: APK de debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Chave de upload (se configurada)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "METALEVE_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: App bundle de release
        env:
          METALEVE_KEYSTORE_PASSWORD: ${{ secrets.METALEVE_KEYSTORE_PASSWORD }}
          METALEVE_KEY_ALIAS: ${{ secrets.METALEVE_KEY_ALIAS }}
          METALEVE_KEY_PASSWORD: ${{ secrets.METALEVE_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: meta-leve-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: meta-leve-release-aab
          path: app/build/outputs/bundle/release/*.aab
